    UpscaleFilter:
      title: Upscale Filter
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: 'Short code name for the AI model.


            Newer models may be accepted before they appear in this list — call `GET /video/status` for the authoritative set of currently supported models.

            '
          enum:
          - aaa-9
          - aaa-10
          - ahq-12
          - alq-13
          - alqs-2
          - amq-13
          - amqs-2
          - ddv-3
          - dtd-4
          - dtds-2
          - dtv-4
          - dtvs-2
          - gcg-5
          - ghq-5
          - hyp-1
          - iris-2
          - iris-3
          - nxf-1
          - nxl-1
          - nyx-3
          - pnat-1
          - prob-4
          - rhea-1
          - stab-1
          - thd-3
          - thf-4
          - thm-2
          example: prob-4
        videoType:
          type: string
          enum:
          - Progressive
          - Interlaced
          - ProgressiveInterlaced
          description: Frame/field type of the video
          example: Progressive
        auto:
          type: string
          enum:
          - Auto
          - Manual
          - Relative
          description: 'Parameter mode of the selected model

            - Auto - parameter estimation is used with no customization

            - Relative - uses auto parameters with optional weights added

            - Manual - all parameters are manually set

            '
          example: Auto
        fieldOrder:
          type: string
          enum:
          - TopFirst
          - BottomFirst
          - Auto
          description: Optional specification of field order for interlaced input videos
          example: Auto
        focusFixLevel:
          type: string
          enum:
          - None
          - Normal
          - Strong
          description: Downscales video input for stronger correction of blurred subjects
          example: Normal
        compression:
          type: number
          minimum: -1
          maximum: 1
          description: Adjust strength of compression recovery
          example: 0.1
        details:
          type: number
          minimum: -1
          maximum: 1
          description: Amount of detail reconstruction
          example: 0.2
        prenoise:
          type: number
          minimum: 0
          maximum: 0.1
          description: Adds noise to input to reduce over-smoothing
          example: 0.01
        noise:
          type: number
          minimum: -1
          maximum: 1
          description: Amount of noise reduction
          example: 0.3
        halo:
          type: number
          minimum: -1
          maximum: 1
          description: Amount of halo reduction
          example: 0.4
        preblur:
          type: number
          minimum: -1
          maximum: 1
          description: Adjust anti-aliasing and deblurring strength
          example: 0.5
        blur:
          type: number
          minimum: -1
          maximum: 1
          description: Amount of sharpness applied
          example: 0.6
        grain:
          type: number
          minimum: 0
          maximum: 0.1
          description: Adds grain after AI model processing
          example: 0.02
        grainSigma:
          type: number
          minimum: 0
          maximum: 1
          description: Grain granularity
          example: 0.5
        grainSize:
          type: number
          minimum: 0
          maximum: 5
          description: Size of generated grain
          example: 1
        grainType:
          type: string
          enum:
          - silver_rich
          - gaussian
          - grey
          description: Type of grain
          example: gaussian
        recoverOriginalDetailValue:
          type: number
          minimum: 0
          maximum: 1
          description: Reintroduce source details into the output video
          example: 0.7
        transferFunction:
          type: string
          enum:
          - pq
          - hlg
          description: HDR transfer function. Applies to the Hyperion model (`hyp-1`).
          example: pq
        adjustExposure:
          type: number
          minimum: 0
          maximum: 1
          description: Exposure adjustment. Applies to the Hyperion model (`hyp-1`).
          example: 0.5
        boostSaturation:
          type: number
          minimum: 0
          maximum: 1
          description: Saturation boost. Applies to the Hyperion model (`hyp-1`).
          example: 0.5
        highlightThreshold:
          type: number
          minimum: 0.45
          maximum: 0.85
          description: Threshold above which pixels are treated as highlights. Applies to the Hyperion model (`hyp-1`).
          example: 0.6
        rollingShutterCorrection:
          type: boolean
          description: 'Correct rolling shutter distortion.


            __Required when the stabilization model (`stab-1`) is used.__ Omitting it returns a 400.

            '
          example: true
        strength:
          type: number
          minimum: 0
          maximum: 16
          description: Stabilization strength. Applies to the stabilization model (`stab-1`).
          example: 8
        reduceMotionJitter:
          type: integer
          minimum: 0
          maximum: 5
          description: Amount of motion jitter reduction. Applies to the stabilization model (`stab-1`).
          example: 2
        fullFrame:
          type: boolean
          description: Preserve the full frame rather than cropping to hide stabilization borders. Applies to the stabilization model (`stab-1`).
          example: false
