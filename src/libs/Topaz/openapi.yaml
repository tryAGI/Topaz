            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            forbiddenExample:
              summary: The provided token does not have access to the endpoint.
              value:
                code: 403
                message: Forbidden
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            notFoundExample:
              summary: The requested image processing job could not be found.
              value:
                code: 404
                message: An image with the given process ID was not found.
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            conflictExample:
              summary: The requested image processing job is not in a cancellable state.
              value:
                code: 409
                message: The process cannot be cancelled as it is not in a cancellable state.
    PreconditionFailed:
      description: The preconditions to process the request were not met.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            preconditionFailedExample:
              summary: No valid API subscription exists for this request.
              value:
                code: 412
                message: Precondition Failed
    RequestEntityTooLarge:
      description: 'The JSON request body exceeds the 3000 byte limit. This response has no body.


        Large bodies are usually caused by long presigned URLs in `source.external` or `destination.external`, or by an unusually large number of filters.

        '
    UnsupportedMediaType:
      description: The request entity has a media type which the server or resource does not support.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            unsupportedMediaTypeExample:
              summary: The image file uploaded is in an unsupported format.
              value:
                code: 415
                message: Image could not be decoded to a supported image type.
    UnprocessableEntity:
      description: The request was well-formed but was unable to be followed due to semantic errors.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            unprocessableEntityExample:
              summary: Image has invalid dimensions (width or height is zero).
              value:
                code: 422
                message: Image has invalid dimensions (width or height is zero).
    TooEarly:
      description: The request was sent too early to be processed. Please wait before retrying.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            tooEarlyExample:
              summary: The request was sent too early to be processed.
              value:
                code: 425
                message: Too early to reserve credits. An order for more credits is in progress.
    TooManyRequests:
      description: Too many requests hit the API too quickly. A backoff (e.g. exponential) is recommended for your requests.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            tooManyRequestsExample:
              summary: The rate limit for requests has been exceeded.
              value:
                code: 429
                message: Too Many Requests
    InternalServerError:
      description: Unexpected error on our end.
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              code:
                type: integer
                description: The HTTP status code.
              message:
                type: string
                description: A human readable error message.
          examples:
            internalServerErrorExample:
              summary: The server encountered an unexpected condition.
              value:
                code: 500
                message: An internal server error occurred. Please try again later. If the problem persists, please contact support.
    VideoBadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Invalid input
              errorCode:
                type: string
                enum:
                - INSUFFICIENT_CREDITS
                - INVALID_INPUT
                - FORBIDDEN
                - UNAUTHORIZED
                - SERVER_MAINTENANCE
                - SERVER_ERROR
                - UNKNOWN
                example: INVALID_INPUT
              errors:
                type: array
                description: Present when the request failed schema validation. One entry per offending field.
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      example: field
                    path:
                      type: string
                      example: source.container
                    location:
                      type: string
                      example: body
                    msg:
                      type: string
                      example: container must be one of mp4, mov, mkv
                    value: {}
