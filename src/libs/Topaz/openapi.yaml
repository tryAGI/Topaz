      - externalId
      properties:
        roleArn:
          type: string
          description: AWS ARN of the role to assume
          example: arn:aws:iam::123456789:role/topazlabs
        externalId:
          type: string
          description: Kind of like a secret string for extra layer of security
          example: MSTnuGztXtTU25XKjVfMJCsujv6VtAGtv1TGSjtOL6M=
        duration:
          type: integer
          minimum: 1
          description: Lifetime of the assumed-role session, in seconds. Defaults to the AWS default when omitted.
          example: 3600
    EnhancedDownloadSignedUrlResponse:
      type: object
      description: 'Signed download URL to the enhanced video file.


        The URL is generated once and then reused for the lifetime of the request — subsequent calls return the same `url`, `expiresIn` and `expiresAt` rather than a freshly signed URL.

        '
      properties:
        url:
          type: string
          example: https://videocloud.r2.cloudflarestorage.com/0193893a-a2ba-799e-b258-928f02c0f419/enhanced.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256...x-id=GetObject
        expiresIn:
          type: integer
          description: TTL in milliseconds. Defaults to 7 days.
          example: 604800000
        expiresAt:
          type: integer
          description: Time in milliseconds since UTC epoch
          example: 1727213400000
    ExternalStorage:
      type: object
      description: 'External storage configuration for source or destination files. `provider` is required.

        Provide either `presignedUrl` alone, or all three of `awsCredentials`, `bucketName`, and `key` together for AWS STS AssumeRole-based access.

        For destinations only, you may instead provide `multipart` with your own pre-signed multi-part upload URLs.


        Source access is verified when the request is created: the presigned URL is fetched, or the object is read using the assumed role. A failure here returns a 400.

        '
      required:
      - provider
      oneOf:
      - required:
        - presignedUrl
      - required:
        - awsCredentials
        - bucketName
        - key
      - required:
        - multipart
      properties:
        provider:
          type: string
          enum:
          - s3
          example: s3
        presignedUrl:
          type: string
          description: Presigned URL to download the source video from or upload the output video to. Provide this alone, or use `awsCredentials`, `bucketName`, and `key` instead.
          example: https://videocloud.s3.amazonaws.com/0193893a-a2ba-799e-b258-928f02c0f419/output.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256...x-id=PutObject
        awsCredentials:
          description: AWS STS AssumeRole credentials for accessing the bucket. Required when using `awsCredentials`/`bucketName`/`key` instead of `presignedUrl`.
          $ref: '#/components/schemas/CredentialsS3'
        bucketName:
          type: string
          description: S3 bucket name. Required when using `awsCredentials`/`bucketName`/`key` instead of `presignedUrl`.
          example: galaxies
        key:
          type: string
          description: 'S3 object key. Required when using `awsCredentials`/`bucketName`/`key` instead of `presignedUrl`.

            The example includes the standard specifier for image sequence requests, with optional directory path. It must begin with "%" and end with the integer specifier "d". The "0" in the example indicates
            left-padding with zeroes, and "6" indicates the number of digits in the file name.

            Keys for video requests must be valid characters supported by S3.

            '
          example: milky_way/%06d.tiff
        multipart:
          type: object
          description: Destination only. Your own pre-signed multi-part upload URLs. These are not validated by Topaz Labs before use.
          required:
          - uploadId
          - urls
          properties:
            uploadId:
              type: string
              example: GDlWC7qIaE6okS41Xf/ktpuS5XzTRabg
            urls:
              type: array
              items:
                type: string
    FrameInterpolationFilter:
      title: Frame Interpolation Filter
      type: object
      required:
      - model
      properties:
        model:
          type: string
          description: 'Short code name for the AI model

            '
          enum:
          - aion-1
          - apf-2
          - apo-8
          - chf-3
          - chr-2
          example: apo-8
        slowmo:
          type: integer
          minimum: 1
          maximum: 16
          description: Slow motion factor applied to input video. For example, a value of 2 makes the output twice as slow and doubles the duration.
          example: 2
        fps:
          type: number
          minimum: 15
          maximum: 240
          description: Output frame rate, does not increase duration
          example: 60
        duplicate:
          type: boolean
          description: Analyze input for duplicate frames and remove them
          example: true
        duplicateThreshold:
          type: number
          minimum: 0.001
          maximum: 0.1
          description: Sensitivity of detection for duplicate frames
          example: 0.01
    InitialEstimates:
      type: object
      description: 'Initial cost and time estimate, recorded when the request is costed. Absent until then — express requests are costed after the source has been received and analyzed.

        '
      properties:
        cost:
          type: array
          description: In credits
          items:
            type: integer
          example:
          - 10
          - 12
        time:
          type: array
          description: In seconds
          items:
            type: integer
          example:
          - 600
          - 700
