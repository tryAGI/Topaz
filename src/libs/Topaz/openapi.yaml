  /video/:
    post:
      tags:
      - Create Request
      summary: Create Video Request
      operationId: CreateVideoRequest
      description: 'Create a new video enhancement request.


        Send information about the video and desired enhancements then receive cost and time estimates.


        Calling this endpoint does NOT consume credits.


        Calling this endpoint does NOT start processing.


        Estimations are based on values provided, and the calculation is rerun once the system receives the source video. If the second estimate is significantly different than the initial values, the request
        is failed and the credits are fully refunded.


        The lower bound value of the cost estimate is billed.


        Time estimates are in development and may not be accurate.


        Output encoder settings are validated on this endpoint — the accepted `videoEncoder` / `videoProfile` combinations, along with the container, resolution, and bitrate limits of each, are listed under
        **Supported encoders and profiles** in **OutputInformationVideo**.


        ## Response body


        | **Property**  | **Type** | **Description**                     |

        |---------------|----------|-------------------------------------|

        | **requestId** | UUID     | Unique request identifier           |

        | **estimates** | Object   | Refer to **RequestEstimates** below |


        #### RequestEstimates


        `cost` and `time` are arrays with two integers each, representing lower and upper bounds of the estimate.


        | **Property** | **Type** | **Description**         |

        |--------------|----------|-------------------------|

        | **cost**     | Array    | Cost range (in credits) |

        | **time**     | Array    | Time range (in seconds) |

        '
      security:
      - apiKey: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRequest'
        example:
          source:
            container: mp4
            size: 16125151
            duration: 213
            frameCount: 6371
            frameRate: 30
            resolution:
              width: 1280
              height: 720
          filters:
          - model: prob-4
          output:
            frameRate: 30
            audioTransfer: Copy
            audioCodec: AAC
            videoEncoder: H265
            videoProfile: Main
            dynamicCompressionLevel: High
            resolution:
              width: 3840
              height: 2160
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateResponse'
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
        '503':
          $ref: '#/components/responses/VideoServiceUnavailable'
  /video/express:
    post:
      tags:
      - Create Express Request
      summary: Create Express Video Request
      operationId: CreateExpressVideoRequest
      description: 'Simplified interface for creating new video enhancement requests.


        This endpoint skips the need to gather video information and uses a single-URL upload rather than multi-part upload. Calling the accept and complete-upload endpoints are also no longer necessary.


        Cost estimates are returned only when they can be calculated at request time; otherwise they are omitted and appear later in the response of the status endpoint, once the system receives and analyzes
        the source video file. The lower bound value is billed.


        The endpoint returns a direct upload URL to our cloud storage for you to HTTP PUT the video file to.


        If `source.external` is provided, the system fetches the source itself: no `uploadId` or `uploadUrls` are returned, credits are reserved immediately, and processing begins right away.


        Image sequence containers are not supported by this endpoint.


        `source.container`, at least one entry in `filters`, and `output.resolution` are the only required fields on this endpoint. The remaining output fields are filled with defaults when omitted — `videoEncoder`
        `H265` with `videoProfile` `Main10`, `container` `mp4`, `audioTransfer` `None`, and `dynamicCompressionLevel` `High` unless `videoBitrate` is set. Two exceptions still apply: `output.audioCodec`
        is required whenever `output.audioTransfer` is `Copy` or `Convert`, and `output.frameRate` is required when a frame interpolation filter omits its own `fps`. See **OutputInformationVideo**, which
        also lists the accepted `videoEncoder` / `videoProfile` combinations and the container, resolution, and bitrate limits of each.


        ## Response body


        | **Property**   | **Type** | **Description**                                                  |

        |----------------|----------|------------------------------------------------------------------|

        | **requestId**  | UUID     | Unique request identifier                                        |

        | **uploadId**   | String   | Upload identifier. Absent when `source.external` is used.         |

        | **uploadUrls** | Array    | URL(s) for uploading video. Absent when `source.external` is used. |

        | **estimates**  | Object   | Refer to **RequestEstimates**. Absent when not yet calculable.     |

        '
      security:
      - apiKey: []
      requestBody:
        $ref: '#/components/requestBodies/CreateExpressRequest'
        example:
          source:
            container: mp4
          filters:
          - model: prob-4
          output:
            resolution:
              width: 3840
              height: 2160
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExpressResponse'
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '413':
          $ref: '#/components/responses/RequestEntityTooLarge'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
        '503':
          $ref: '#/components/responses/VideoServiceUnavailable'
  /video/{requestId}/accept:
    patch:
      tags:
      - Accept Request
      summary: Accept and Upload Video Request
      operationId: AcceptVideoRequest
      description: 'Calling this endpoint reserves the estimated credits and returns signed upload URL(s).


        ### Video uploads

        A **single** upload URL is returned when `source.size` is at or under **500 MB**, or when `source.frameCount` is 1,000 or fewer. PUT the whole file to `urls[0]`; there are no part numbers or ETags
        to collect in that case.


        Every larger source uses multi-part upload. The number of URLs returned is `source.size` divided by the **500 MB** segment size, rounded up — always at least 2 on this path — and capped at 150 URLs.
        Split the file into `max(500 MB, ceil(source.size / urls.length))`-byte segments and PUT them in order, one per URL: that is a plain 500 MB byte division for anything up to 75 GB, and larger segments
        for the sources above it where the 150-URL cap binds.


        For example, a 1.2 GB video file returns 3 upload URLs, so 500 MB segments cover it exactly:


        - Upload bytes 0-499,999,999 via HTTP PUT to `urls[0]`

        - Upload bytes 500,000,000-999,999,999 via HTTP PUT to `urls[1]`

        - Upload bytes 1,000,000,000-1,199,999,999 via HTTP PUT to `urls[2]`


        If one of the uploads fail, you may reuse the same URL to retry - the action overwrites any partially uploaded data.


        A successful response from the PUT request returns an `ETag` value in the header for each segment. Retain the part number and ETag pair for the next step (PATCH /video/{requestId}/complete-upload/).


        If the request was created with `source.external`, there is nothing to upload: this endpoint reserves credits, starts processing, and returns `202` with a `message` instead of upload URLs.


        Calling this endpoint again after the URLs have been issued returns the same `uploadId` and `urls`.


        ## Response body


        | **Property**  | **Type**   | **Description**                                     |

        |---------------|------------|-----------------------------------------------------|

        | **uploadId**  | String     | Upload ID for completing the upload                 |

        | **urls**      | Array      | Upload URLs                                         |

        | **message**   | String     | Returned instead of the above when `source.external` was used |

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptResponse'
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '402':
          $ref: '#/components/responses/VideoPaymentRequired'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
        '503':
          $ref: '#/components/responses/VideoServiceUnavailable'
  /video/{requestId}/complete-upload/:
    patch:
      tags:
      - Complete Upload
      summary: Complete Video Upload
      operationId: CompleteVideoUpload
      description: "Send metadata of the multi-part uploads to complete the upload and begin processing the video.\n\nOptionally include the MD5 hash of the source video file to validate successful upload\
        \ before processing.\n\nIf the accept endpoint returned a single upload URL, the contents of `uploadResults` are not used — the field is still required by request validation, so send a single placeholder\
        \ entry such as `[{\"partNum\": 1, \"eTag\": \"unused\"}]`.\n\n## Request body\n\n| **Property**    | **Type**         | **Description**                                                         \
        \                                |\n|-----------------|------------------|---------------------------------------------------------------------------------------------------------|\n| **uploadResults**\
        \           | Array   | An array of part number and ETag pairs of the uploaded parts. ETags are returned by S3 upon upload of the part. |\n| **uploadResults.*.partNum** | Integer | Part number of\
        \ the uploaded part, starting from 1                                                      |\n| **uploadResults.*.eTag**    | String  | eTag value returned by S3 upon upload of the part   \n"
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      requestBody:
        $ref: '#/components/requestBodies/CompleteUpload'
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Processing has been queued
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/{requestId}:
    get:
      tags:
      - Get Request
      summary: Get Video Request
      operationId: GetVideoRequest
      description: 'Retrieve the full record of a single request, in the same shape as the entries returned by `GET /video/history`.


        Use this endpoint when you need the details of the request itself — the `filters` and `output` you submitted, the corrected source metrics, the credit transactions, and the signed download URLs.
        For progress polling, use `GET /video/{requestId}/status` instead: it reports `progress`, live processing statistics, and upload URLs, none of which are returned here.


        The `source` metrics start as the values you supplied and are corrected once the system analyzes the file. `estimates` holds the initial cost and time estimate and is absent until the request has
        been costed — express requests are costed after the source has been received and analyzed.


        Unlike `GET /video/history`, this endpoint also returns requests that are still in the `requested` state.

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoRequestRecord'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
    delete:
      tags:
      - Cancel Request
      summary: Cancel Video Request
      operationId: CancelVideoRequest
      description: 'Cancel a video enhancement request.


        If the request is canceled before any processing starts, then all reserved credits are refunded.


        If the request is canceled during processing, then a partial refund is issued based on the progress. For example, if the request is 50% complete, then approximately 50% of the reserved credits are
        refunded.

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '200':
          description: Successful response, message may also indicate if there is a parital refund, if applicable
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cancellation in progress. Partial credits have been refunded.
        '204':
          description: Successful response, already canceled or in progress
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/{requestId}/cancel-estimate:
    get:
      tags:
      - Cancel Estimate
      summary: Estimate Cancellation Outcome
      operationId: GetCancelEstimate
      description: 'Preview the credit outcome of canceling a request without actually canceling it.


        This uses the same settlement math as the cancel endpoint (DELETE /video/{requestId}), so the estimate reflects what you would be charged and refunded if you cancel now.


        - If the request has not started processing, canceling refunds all reserved credits and charges nothing.

        - If the request is partially processed, canceling commits a prorated amount (plus a small cancellation penalty) and refunds the remainder.

        - If the request is already canceling or canceled, it is reported as not cancelable with a zeroed estimate.


        Requests that have already completed or failed cannot be canceled and return a 400.


        ## Response body


        | **Property**        | **Type** | **Description**                                              |

        |---------------------|----------|-------------------------------------------------------------|

        | **requestId**       | UUID     | Unique request identifier                                   |

        | **status**          | String   | Current processing status                                   |

        | **cancelable**      | Boolean  | Whether the request can still be canceled                   |

        | **progress**        | Integer  | Processing progress used for settlement (percentage, 0-100) |

        | **creditsReserved** | Integer  | Credits currently reserved for the request                  |

        | **creditsToCommit** | Integer  | Credits that would be charged if canceled now               |

        | **creditsToRefund** | Integer  | Credits that would be refunded if canceled now              |

        | **message**         | String   | Human-readable summary of the cancellation outcome          |

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelEstimateResponse'
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/{requestId}/media:
    delete:
      tags:
      - Delete Files
      summary: Delete Video Files
      operationId: DeleteVideoFiles
      description: 'This endpoint will delete your source and enhanced video files associated with the request from Topaz Labs storage, if any exists.


        Note: All videos are automatically deleted after 7 days unless you request a shorter TTL.

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '204':
          description: Successful response, already canceled or in progress
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/{requestId}/status:
    get:
      tags:
      - Get Request Status
      summary: Get Video Request Status
      operationId: GetVideoRequestStatus
      description: 'Get status of the request.


        If processing is complete, the response will include a signed URL to access the enhanced video.


        Make sure to download and save the video within the TTL provided in the response (7 days by default). The signed URL is generated once and then reused: calling this endpoint again returns the same
        URL and the same expiry rather than issuing a fresh one. We retain your data for only a limited number of days, after which the video is permanently deleted from our system.


        ## Response body


        | **Property**         | **Type**  | **Description**                                   |

        |---------------------|----------|-----------------------------------------------------|

        | **status**           | String   | Current processing status                          |

        | **message**          | String   | Human-readable status message                      |

        | **errorCode**        | String   | Failure code from the processing pipeline, present only when status is failed |

        | **progress**         | Number   | Total request progress (percentage)                |

        | **estimates**        | Object   | Refer to **RequestEstimates**                      |

        | **uploadId**         | String   | Present while the request is awaiting source upload |

        | **urls**             | Array    | Outstanding upload URLs, present while the request is awaiting source upload |

        | **outputSize**       | String   | Size of output video                               |

        | **averageFps**       | Number   | Average FPS of processing nodes                    |

        | **combinedFps**      | Number   | Combined FPS of all nodes                          |

        | **processingJobs**   | Array    | Refer to **VideoProcessingStatIntermediate** below   |

        | **download**         | Object   | Refer to **EnhancedDownloadSignedUrlResponse** below |

        | **comparisonTool**   | String   | URL to a before/after comparison view, present only for free renders |


        `outputSize`, `averageFps`, `combinedFps` and `processingJobs` are reported for chunked enhancement requests. They are absent for requests handled end-to-end by the inference backend.


        ---


        #### RequestEstimates


        `cost` and `time` are arrays with two integers each, representing lower and upper bounds of the estimate.


        | **Property**  | **Type**  | **Description**                                    |

        |---------------|----------|-----------------------------------------------------|

        | **cost**      | Array    | Cost range (in credits)                             |

        | **time**      | Array    | Time range (in seconds)                             |


        ---


        #### VideoProcessingStatIntermediate


        | **Property**         | **Type**  | **Description**                                   |

        |---------------------|----------|-----------------------------------------------------|

        | **chunkId**          | UUID     | Unique chunk identifier                            |

        | **chunkIndex**       | Integer  | Index of the chunk                                 |

        | **taskIndex**        | Integer  | Task index for chunk processing                    |

        | **status**           | String   | Status (queued, processing, complete, etc.)        |

        | **progress**         | Number   | Processing progress (percentage)                   |

        | **averageFps**       | Number   | Processing speed of the node                       |

        | **averageGpuUtilization** | Number | GPU utilization in percentage                    |

        | **averageGpuMemoryUtilization** | Number | GPU memory usage percentage                |


        ---


        #### EnhancedDownloadSignedUrlResponse


        | **Property**   | **Type**  | **Description**                 |

        |----------------|-----------|---------------------------------|

        | **url**        | String    | Signed download URL for the enhanced file |

        | **expiresIn**  | Integer   | TTL in milliseconds                  |

        | **expiresAt**  | Integer   | Time in milliseconds since UTC epoch |

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoStatusResponse'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/{requestId}/metrics:
    get:
      tags:
      - Get Request Metrics
      summary: Get Video Request Metrics
      operationId: GetVideoRequestMetrics
      description: 'Get metrics for the request


        Metrics are derived from chunked enhancement processing. For requests handled end-to-end by the inference backend, and for requests that have not begun processing, this endpoint returns `200` with
        only a `message` field indicating that metrics are unavailable.


        ## Response body


        | **Property**        | **Type** | **Description**                                     |

        |---------------------|----------|-----------------------------------------------------|

        | **minutesInState**  | Object   | Minutes spent in various processing states          |

        | **minutesInState.pendingSourceUpload** | Number    | - |

        | **minutesInState.initializing**        | Number    | - |

        | **minutesInState.preprocessing**       | Number    | - |

        | **minutesInState.processing**          | Number    | - |

        | **minutesInState.postprocessing**      | Number    | - |

        | **minutesToEnhance**| Number   | Time to complete enhancement after source upload    |

        | **inputFrames**     | Integer  | Number of input frames                              |

        | **outputFrames**    | Integer  | Number of output frames                             |

        | **inputSize**       | String   | Size of input video                                 |

        | **outputSize**      | String   | Size of output video                                |

        | **chunks**          | Array    | Refer to **VideoChunkMetrics** below                |


        ---


        #### VideoChunkMetrics


        | **Property**        | **Type**   | **Description**                                  |

        |---------------------|------------|--------------------------------------------------|

        | **chunkIndex**                | Integer   | Index of the chunk                      |

        | **tasks**                     | Array     | List of processing tasks for the chunk  |

        | **tasks.*.minutesProcessing** | Number    | Duration of processing in minutes       |

        | **tasks.*.averageFps**        | Number    | Average processing speed of the node    |

        | **tasks.*.averageGpuUtilization** | Number | GPU utilization in percentage          |

        | **tasks.*.averageGpuMemoryUtilization** | Number | GPU memory usage percentage      |

        | **tasks.*.inputFrames**       | Integer   | Number of input frames                  |

        | **tasks.*.outputFrames**      | Integer   | Number of output frames                 |

        | **tasks.*.inputSize**         | String    | Size of the input file                  |

        | **tasks.*.outputSize**        | String    | Size of the output file                 |

        '
      security:
      - apiKey: []
      parameters:
      - in: path
        name: requestId
        schema:
          type: string
          format: uuid
          example: c1f96dc2-c448-00e6-82ed-14ecb6403c62
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '404':
          $ref: '#/components/responses/VideoNotFound'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
  /video/history:
    get:
      tags:
      - Get Request History
      summary: Get My Request History
      operationId: GetHistory
      description: 'This endpoint will return your processing history, newest first, up to 50 requests per page. Requests that have not been accepted yet (status `requested`) are omitted — fetch those individually
        with `GET /video/{requestId}`.


        A page may contain fewer than 50 requests even when more are available, so keep following `nextCursor` until it comes back `null`.

        '
      parameters:
      - name: cursor
        in: query
        required: false
        description: Base64url-encoded cursor for pagination. Use the `nextCursor` value from a previous response to fetch the next page.
        schema:
          type: string
          format: base64url
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoRequestRecord'
                  nextCursor:
                    type: string
                    format: base64url
                    nullable: true
                    description: Cursor to pass as the `cursor` query parameter to fetch the next page. `null` when there are no more results.
        '400':
          $ref: '#/components/responses/VideoBadRequest'
        '401':
          $ref: '#/components/responses/VideoUnauthorized'
        '403':
          $ref: '#/components/responses/VideoForbidden'
        '500':
          $ref: '#/components/responses/VideoInternalServerError'
components:
  schemas:
    EnhanceGANRequest:
      type: object
      properties:
        image:
          type: string
          contentMediaType: application/octet-stream
          description: "The image file to be processed. Supported formats:\n  - jpeg (or jpg)\n  - png\n  - tiff (or tif)\n"
        source_id:
          type: string
          description: Unique identifier of the source image.
          examples:
          - d7b3b3b3-7b3b-4b3b-8b3b-3b3b3b3b3b3b
        source_url:
          type: string
          description: The URL of the source image.
          examples:
          - https://example.com/image.jpg
        model:
          type: string
          description: The model to use for processing the image.
          enum:
          - Standard V2
          - Low Resolution V2
          - CGI
          - High Fidelity V2
          - Text Refine
          default: Standard V2
        output_height:
          type: integer
          description: The desired height of the output image in pixels. Your image will automatically be upscaled to this specified value. If only one of `output_height` and `output_width` is set, then
            the other dimension is scaled proportionally.
          minimum: 1
          maximum: 32000
          examples:
          - 1080
        output_width:
          type: integer
          description: The desired width of the output image in pixels. Your image will automatically be upscaled to this specified value. If only one of `output_height` and `output_width` is set, then
            the other dimension is scaled proportionally.
          minimum: 1
          maximum: 32000
          examples:
          - 1920
        crop_to_fill:
          type: boolean
          description: Default behavior is to letterbox the image if a differing aspect ratio is chosen. Enable `crop_to_fill` by setting this to `true` if you instead want to crop the image to fill the
            dimensions.
          default: false
        output_format:
          type: string
          description: The desired format of the output image.
          enum:
          - jpeg
          - jpg
          - png
          - tiff
          - tif
          default: jpeg
        webhook_url:
          type: string
          description: "The URL to send the webhook to. When provided, a POST request with a JSON payload will be sent to this URL when the job status changes or completes.\n\n**Request Body:**\nThe webhook\
            \ will be sent as a POST request with `Content-Type: application/json` containing the following fields:\n  - `notification_id` (string, ULID): Unique identifier for this notification. Can be\
            \ used to order messages in case they are received out of order; see the [ULID specification](https://github.com/ulid/spec)\n  - `process_id` (string, UUID): Unique identifier of the image processing\
