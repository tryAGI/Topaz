    OutputInformationImageSequence:
      type: object
      required:
      - resolution
      - frameRate
      properties:
        resolution:
          type: object
          description: Desired output resolution
          required:
          - width
          - height
          properties:
            width:
              type: integer
              description: Width in pixels. The maximum size depends on the encoder and can be referenced using the table below <table> <tr> <td>H264</td> <td>H265</td> <td>ProRes <td>AV1 <td>VP9 </tr>
                <tr> <td>4096</td> <td>8192</td> <td>16386</td> <td>16384</td> <td>8192</td> </tr> </table>
              example: 7680
            height:
              type: integer
              description: Height in pixels. The maximum size depends on the encoder and can be referenced using the table below <table> <tr> <td>H264</td> <td>H265</td> <td>ProRes <td>AV1 <td>VP9 </tr>
                <tr> <td>4096</td> <td>8192</td> <td>16386</td> <td>8704</td> <td>8192</td> </tr> </table>
              example: 4320
        frameRate:
          type: number
          description: Frame rate
          example: 30
        videoEncoder:
          type: string
          enum:
          - DPX
          - EXR
          - JPG
          - JPEG
          - PNG
          - TIFF
          example: TIFF
        videoProfile:
          type: string
          description: Codec profile specific to videoEncoder
          example: Main
        cropToFit:
          type: boolean
          description: Center cropping to fit the output dimensions
          example: true
        container:
          type: string
          enum:
          - DPX
          - EXR
          - JPG
          - JPEG
          - PNG
          - TIFF
          description: Desired output container, defaults to the input container
          example: TIFF
    OutputInformationVideo:
      type: object
      description: 'Desired output settings.


        Some values are adjusted server-side before processing:


        - `resolution` width and height are rounded up to the nearest multiple of 4.

        - `resolution` is forced to the source resolution when no upscale model is present in `filters`.

        - `frameRate` is forced to the source frame rate when no frame interpolation model is present in `filters`, and defaults to it when omitted.

        - With a frame interpolation model, `frameRate` and that filter''s `fps` are both set to the greater of the two.

        - `container` is forced to `mov` when `videoEncoder` is `ProRes` and to `mp4` when it is `AV1` or `VP9`, and defaults to `mp4` otherwise.


        The express endpoint supplies no source metadata, so nothing is inferred from the source there: only `resolution` is required, `frameRate` is required only when a frame interpolation filter omits
        its own `fps`, and the rest of the fields listed as required below take the defaults noted above.


        #### Supported encoders and profiles


        Every accepted `videoEncoder` / `videoProfile` pair is listed below. `videoEncoder` defaults to `H265` and `videoProfile` to the default profile of the chosen encoder. Any other combination is rejected
        with `400` `INVALID_INPUT`, and the error message lists the profiles the encoder does support.


        | **videoEncoder** | **videoProfile**     | **container**       | **Max resolution** |

        |------------------|----------------------|---------------------|--------------------|

        | AV1              | `8-bit` _(default)_  | `mp4`               | 16384 x 8704       |

        | AV1              | `10-bit`             | `mp4`               | 16384 x 8704       |

        | H264             | `High` _(default)_   | `mp4`, `mov`, `mkv` | 4096 x 4096        |

        | H265             | `Main`               | `mp4`, `mov`, `mkv` | 8192 x 8192        |

        | H265             | `Main10` _(default)_ | `mp4`, `mov`, `mkv` | 8192 x 8192        |

        | ProRes           | `422 Proxy`          | `mov`               | 16386 x 16386      |

        | ProRes           | `422 LT`             | `mov`               | 16386 x 16386      |

        | ProRes           | `422 Std`            | `mov`               | 16386 x 16386      |

        | ProRes           | `422 HQ` _(default)_ | `mov`               | 16386 x 16386      |

        | VP9              | `Good` _(default)_   | `mp4`               | 8192 x 8192        |

        | VP9              | `Best`               | `mp4`               | 8192 x 8192        |


        - Encoder and profile values are matched case-insensitively.

        - **Max resolution** applies in either orientation, so AV1 also accepts 8704 x 16384. Exceeding it is rejected with `400` `INVALID_INPUT`.

        - **container** lists the containers you can receive for that encoder. ProRes, AV1, and VP9 replace whatever `container` you send with the single value shown; H264 and H265 honor your choice among
        the values shown.

        - `videoBitrate` is capped per encoder — **800 mbps** for AV1, **2000 mbps** for H264, H265, and VP9, and uncapped for ProRes. A higher value is rejected with `400` `INVALID_INPUT` — unless `dynamicCompressionLevel`
        is also set, in which case `videoBitrate` is discarded and the compression level is used instead.

        - `VP9` requires `videoBitrate`. Selecting it without one is rejected with `400` `INVALID_INPUT`.

        - `dynamicCompressionLevel` maps to a CQP value defined per encoder and profile, and applies to AV1, H264, and H265 only.

        - For ProRes and VP9 the storage portion of the cost estimate is derived from the source file size rather than a predicted output size.

        '
      required:
      - resolution
      - frameRate
      - audioTransfer
      properties:
        resolution:
          type: object
          description: Desired output resolution
          required:
          - width
          - height
          properties:
            width:
              type: integer
              description: Width in pixels. The maximum depends on `videoEncoder` — see **Supported encoders and profiles** above.
              example: 7680
            height:
              type: integer
              description: Height in pixels. The maximum depends on `videoEncoder` — see **Supported encoders and profiles** above.
              example: 4320
        frameRate:
          type: number
          description: Frame rate
          example: 30
        audioBitrate:
          type: string
          description: Audio bitrate, if audioTransfer is Copy or Convert. Default values for the codec are used if not provided.
          example: '320'
        audioCodec:
          type: string
          enum:
          - AAC
          - AC3
          - PCM
          description: __Required unless audioTransfer is None.__
          example: AAC
        audioTransfer:
          type: string
          enum:
          - Copy
          - Convert
          - None
          example: Copy
        videoEncoder:
          type: string
          description: Video encoder for the output. Defaults to `H265`. See **Supported encoders and profiles** above for the profiles, containers, and limits of each encoder.
          enum:
          - AV1
          - H264
          - H265
          - ProRes
          - VP9
          example: H265
        videoBitrate:
          type: string
          description: Constant bitrate, suffixed with "k" for kilobits or "m" for megabits per second. Mutually exclusive with `dynamicCompressionLevel`. __Required when `videoEncoder` is `VP9`.__ Each
            encoder caps this value — see **Supported encoders and profiles** above.
          example: 1k
        dynamicCompressionLevel:
          type: string
          enum:
          - Low
          - Mid
          - High
          description: Automatic CQP selection. Mutually exclusive with `videoBitrate`. If neither is provided, this defaults to `High`. Applies to the `AV1`, `H264`, and `H265` encoders only.
          example: Mid
        videoProfile:
          type: string
          description: Codec profile, specific to the chosen `videoEncoder`. Defaults to that encoder's default profile (`Main10` for `H265`). See **Supported encoders and profiles** above for the accepted
            values.
          example: Main
        cropToFit:
          type: boolean
          description: Center cropping to fit the output dimensions
          example: true
        container:
          type: string
          enum:
          - mp4
          - mov
          - mkv
          - avi
          - webm
          description: Desired output container. Defaults to `mp4`. Ignored and replaced with `mov` when `videoEncoder` is `ProRes`, and with `mp4` when it is `AV1` or `VP9`.
          example: mp4
